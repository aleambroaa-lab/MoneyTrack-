
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack - Versione Definitiva</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #b5c3b6; --secondary: #9aa89b; --bg: #ffffff;
            --success: #28a745; --danger: #dc3545; --border: #eeeeee;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: #333; }

        /* HEADER & NAVIGATION */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 5px 15px; border-bottom: 2px solid var(--border);
            position: sticky; top: 0; z-index: 100; height: 60px; box-sizing: border-box;
        }
        .logo-box img { height: 45px; border-radius: 6px; cursor: pointer; }
        .nav-right { display: flex; align-items: center; }
        .nav-buttons button {
            background: white; border: none; color: #555; padding: 8px 14px;
            border-radius: 10px; cursor: pointer; margin-left: 5px; font-weight: bold;
            box-shadow: 0 3px #e0e0e0; transition: 0.2s; font-size: 0.85rem;
        }
        .nav-buttons button:active { transform: translateY(2px); box-shadow: 0 1px #e0e0e0; }

        .menu-container { position: relative; margin-left: 10px; }
        .menu-dots { font-size: 1.5rem; cursor: pointer; color: #555; padding: 5px 10px; border-radius: 50%; }
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 45px;
            background-color: white; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            z-index: 101; border-radius: 12px; border: 1px solid #eee; overflow: hidden;
        }
        .dropdown-content a { color: #444; padding: 10px 15px; text-decoration: none; display: block; font-size: 0.9rem; cursor: pointer; }
        .dropdown-content a:hover { background-color: #f8f9fa; color: var(--success); }
        .show { display: block !important; }

        /* MAIN LAYOUT */
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 40px; }
        .header-saldo { padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; transition: background 0.3s; }
        #saldo-cifra { margin: 5px 0 0 0; font-size: 2.2rem; font-weight: bold; }
        .info-previsione { text-align: right; padding: 0 20px 15px 20px; border-bottom: 1px solid var(--border); }

        .section { padding: 20px; border-bottom: 1px solid var(--border); }
        h3 { margin-top: 0; font-size: 1.1rem; color: #444; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        input, select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px;
            font-size: 1rem; background: #fafafa; box-sizing: border-box; margin-bottom: 10px; outline: none;
        }
        input:focus { border-color: var(--primary); }

        .cat-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .small-btn {
            padding: 0 15px; border-radius: 10px; border: 1px solid #ddd;
            background: #eee; cursor: pointer; font-weight: bold; height: 46px; display: flex; align-items: center;
        }

        .add-btn {
            background: var(--primary); color: white; border: none; font-weight: bold;
            padding: 16px; border-radius: 12px; cursor: pointer; width: 100%; font-size: 1rem;
            box-shadow: 0 5px var(--secondary); margin-top: 5px; transition: 0.1s;
        }
        .add-btn:active { transform: translateY(3px); box-shadow: 0 2px var(--secondary); }

        /* TABLES & LISTS */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 0; border-bottom: 1px solid #f4f4f4; }
        .positivo { color: var(--success); font-weight: bold; }
        .negativo { color: var(--danger); font-weight: bold; }
        .action-icon { cursor: pointer; margin-left: 10px; font-size: 1rem; opacity: 0.6; transition: 0.2s; }
        .action-icon:hover { opacity: 1; transform: scale(1.2); }

        /* ACCORDION MONTHS */
        .mese-container { border-bottom: 1px solid #eee; }
        .mese-header {
            background: #fdfdfd; padding: 14px 20px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; color: #555; border-bottom: 1px solid #f0f0f0;
        }
        .mese-content { display: none; padding: 0 20px; }
        .mese-container.attivo .mese-content { display: block; }
        .mese-container.attivo .mese-header { background: #f1f3f5; }

        @media (min-width: 768px) {
            .desktop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .section-divider { border-right: 1px solid var(--border); border-bottom: none; }
            
            <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Nome Tua App">

<link rel="apple-touch-icon" href="icona-512.png">
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-box" onclick="mostraPagina('home')">
        <img src="logo.png" alt="MT" onerror="this.src='https://via.placeholder.com/100x40/b5c3b6/FFFFFF?text=MoneyTrack'">
    </div>
    <div class="nav-right">
        <div class="nav-buttons">
            <button onclick="mostraPagina('riepilogo')">📊 Analisi</button>
            <button id="loginBtn" onclick="fintoLogin()">Accedi</button>
        </div>
        <div class="menu-container">
            <div class="menu-dots" onclick="toggleMenu()">⋮</div>
            <div id="myDropdown" class="dropdown-content">
                <a onclick="esportaDati()">💾 Backup (Esporta)</a>
                <a onclick="document.getElementById('fileInput').click()">📂 Ripristina (Importa)</a>
            </div>
        </div>
        <input type="file" id="fileInput" style="display:none" onchange="importaDati(event)">
    </div>
</nav>

<div id="pagina-home" class="container">
    <div class="header-saldo" id="boxSaldo">
        <div><small>DISPONIBILITÀ ATTUALE</small><h1 id="saldo-cifra">0.00 €</h1></div>
        <button onclick="togglePrivacy()" style="background:rgba(0,0,0,0.1); border:none; color:white; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size: 1.2rem;">👁️</button>
    </div>
   
    <div id="previsione-fine-mese" class="info-previsione"></div>

    <div class="desktop-grid">
        <div class="section section-divider">
            <h3 id="form-label">✍️ Nuova Operazione</h3>
            <input type="hidden" id="edit-index" value="-1">
            <select id="tipo" onchange="aggiornaCategorie()">
                <option value="Uscita">📉 Uscita</option>
                <option value="Entrata">📈 Entrata</option>
            </select>
            <input type="date" id="data">
           
            <div class="cat-row">
                <select id="categoria"></select>
                <button class="small-btn" onclick="creaCategoria()" title="Aggiungi">➕</button>
                <button class="small-btn" onclick="eliminaCategoria()" title="Elimina" style="color: var(--danger);">➖</button>
            </div>
            <input type="number" id="importo" placeholder="Importo (€)" step="0.01">
            <input type="text" id="nota" placeholder="Nota (es. Spesa Esselunga)">
            <button class="add-btn" id="btn-salva" onclick="aggiungiOperazione()">SALVA MOVIMENTO</button>

            <h3 style="margin-top: 35px;">📅 Scadenze Future</h3>
            <input type="date" id="data-futura">
            <input type="text" id="desc-futura" placeholder="Descrizione (es. Affitto)">
            <input type="number" id="imp-futura" placeholder="Importo stimato (€)">
            <button class="add-btn" style="background: var(--secondary); box-shadow: 0 5px #808d81;" onclick="aggiungiSpesaFutura()">PROGRAMMA</button>
            <div class="table-container"><table><tbody id="lista-future"></tbody></table></div>
        </div>

        <div class="section">
            <h3>📊 Analisi Spese Mese</h3>
            <div style="height: 250px; position: relative;">
                <canvas id="graficoTorta"></canvas>
            </div>
           
            <h3 style="margin-top: 30px;">🕒 Storico</h3>
            <input type="text" id="filtroRicerca" onkeyup="aggiornaApp()" placeholder="🔍 Cerca tra note o categorie...">
            <div id="lista-transazioni"></div>
        </div>
    </div>
</div>

<div id="pagina-riepilogo" class="container" style="display: none; padding: 20px;">
    <h3>📈 Andamento Annuale</h3>
    <div style="height: 300px; margin-bottom: 30px;">
        <canvas id="graficoAnnuale"></canvas>
    </div>
   
    <h3>📋 Riepilogo Mensile</h3>
    <div class="table-container">
        <table style="font-size: 0.8rem; text-align: center;">
            <thead><tr id="headerMesi"></tr></thead>
            <tbody id="bodyMatrice"></tbody>
        </table>
    </div>
    <button onclick="mostraPagina('home')" class="add-btn" style="background:#666; box-shadow: 0 5px #444; margin-top:30px;">TORNA ALLA HOME</button>
</div>

<script>
    // --- DATABASE & STATO ---
    let spese = JSON.parse(localStorage.getItem("moneyTrack_db")) || [];
    let future = JSON.parse(localStorage.getItem("moneyTrack_future")) || [];
    let customCats = JSON.parse(localStorage.getItem("moneyTrack_cats")) || {
        "Uscita": ["🏠 Casa", "🍕 Cibo", "🚗 Auto", "🛒 Spesa", "⏳ Programmata"],
        "Entrata": ["💰 Stipendio", "➕ Altro"]
    };

    let graficoTorta, graficoBarre, privacy = false;
    const mesiNomi = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];
    const mesiEstesi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

    // --- NAVIGAZIONE & MENU ---
    function toggleMenu() { document.getElementById("myDropdown").classList.toggle("show"); }
    window.onclick = (e) => { if (!e.target.matches('.menu-dots')) document.getElementById("myDropdown").classList.remove('show'); }

    function mostraPagina(p) {
        document.getElementById("pagina-home").style.display = p === 'home' ? 'block' : 'none';
        document.getElementById("pagina-riepilogo").style.display = p === 'riepilogo' ? 'block' : 'none';
        if(p === 'riepilogo') setTimeout(generaReport, 50);
        window.scrollTo(0,0);
    }

    // --- GESTIONE CATEGORIE ---
    function aggiornaCategorie() {
        const t = document.getElementById("tipo").value;
        const s = document.getElementById("categoria");
        s.innerHTML = customCats[t].map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function creaCategoria() {
        const t = document.getElementById("tipo").value;
        const nuova = prompt("Nome nuova categoria per " + t + ":");
        if(nuova) {
            customCats[t].push(nuova);
            saveCats();
            aggiornaCategorie();
            document.getElementById("categoria").value = nuova;
        }
    }

    function eliminaCategoria() {
        const t = document.getElementById("tipo").value;
        const sel = document.getElementById("categoria").value;
        if(confirm(`Eliminare "${sel}"?`)) {
            customCats[t] = customCats[t].filter(c => c !== sel);
            if(customCats[t].length === 0) customCats[t] = ["Generica"];
            saveCats();
            aggiornaCategorie();
        }
    }

    function saveCats() { localStorage.setItem("moneyTrack_cats", JSON.stringify(customCats)); }

    // --- LOGICA CORE ---
    function aggiornaApp() {
        const l = document.getElementById("lista-transazioni");
        const box = document.getElementById("boxSaldo");
        const query = document.getElementById("filtroRicerca").value.toLowerCase();
       
        l.innerHTML = "";
        let saldo = 0, catsUscita = {}, totUsciteMese = 0;
        let gruppi = {};
        const oggi = new Date();

        // Calcoli e raggruppamento
        [...spese].sort((a,b) => new Date(b.data) - new Date(a.data)).forEach(s => {
            const indexOrig = spese.indexOf(s);
            const dataS = new Date(s.data);
           
            // Saldo totale (sempre)
            if(s.tipo === "Entrata") saldo += s.imp; else saldo -= s.imp;

            // Statistiche grafico (mese corrente)
            if(dataS.getMonth() === oggi.getMonth() && dataS.getFullYear() === oggi.getFullYear()) {
                if(s.tipo === "Uscita") {
                    catsUscita[s.cat] = (catsUscita[s.cat] || 0) + s.imp;
                    totUsciteMese += s.imp;
                }
            }

            // Filtro ricerca
            if (query && !s.nota.toLowerCase().includes(query) && !s.cat.toLowerCase().includes(query)) return;

            // Creazione gruppi mesi
            const chiaveMese = `${mesiEstesi[dataS.getMonth()]} ${dataS.getFullYear()}`;
            if (!gruppi[chiaveMese]) gruppi[chiaveMese] = [];
            gruppi[chiaveMese].push(`
                <tr>
                    <td><small>${s.data}</small><br><strong>${s.cat}</strong><br><small>${s.nota || ''}</small></td>
                    <td style="text-align:right">
                        <span class="${s.tipo === 'Entrata' ? 'positivo':'negativo'}">${s.imp.toFixed(2)}€</span>
                        <span class="action-icon" onclick="preparaModifica(${indexOrig})">✏️</span>
                        <span class="action-icon" onclick="eliminaRiga(${indexOrig})">🗑️</span>
                    </td>
                </tr>`);
        });

        // UI Updates
        document.getElementById("saldo-cifra").innerText = privacy ? "*** €" : saldo.toFixed(2) + " €";
        box.style.backgroundColor = saldo >= 0 ? "var(--success)" : "var(--danger)";
       
        // Accordion rendering
        for (let m in gruppi) {
            const div = document.createElement('div');
            div.className = 'mese-container';
            if (m.includes(mesiEstesi[oggi.getMonth()])) div.classList.add('attivo');
            div.innerHTML = `
                <div class="mese-header" onclick="this.parentElement.classList.toggle('attivo')">
                    <span>📅 ${m}</span>
                    <span style="font-size:0.8rem; opacity:0.6">${gruppi[m].length} movimenti ▾</span>
                </div>
                <div class="mese-content"><table>${gruppi[m].join("")}</table></div>`;
            l.appendChild(div);
        }

        calcolaPrevisione(saldo);
        disegnaTorta(catsUscita, totUsciteMese);
        aggiornaListaFuture();
    }

    function calcolaPrevisione(saldoAttuale) {
        const oggi = new Date();
        const fineMese = new Date(oggi.getFullYear(), oggi.getMonth() + 1, 0);
        let impegni = future.filter(f => {
            const df = new Date(f.data);
            return df >= oggi && df <= fineMese;
        }).reduce((acc, curr) => acc + curr.imp, 0);

        const previsto = saldoAttuale - impegni;
        const div = document.getElementById("previsione-fine-mese");
       
        if(privacy) {
            div.innerHTML = `<small>Previsione fine mese: *** €</small>`;
        } else {
            div.innerHTML = `
                <small>Fine mese stimato: <strong>${previsto.toFixed(2)}€</strong></small>
                <br><small style="color:var(--danger)">Impegni previsti: -${impegni.toFixed(2)}€</small>`;
        }
    }

    function aggiungiOperazione() {
        const d = document.getElementById("data").value, i = parseFloat(document.getElementById("importo").value);
        const editIdx = parseInt(document.getElementById("edit-index").value);
        if(!d || isNaN(i)) return alert("Inserisci data e importo!");

        const obj = {tipo: document.getElementById("tipo").value, data: d, cat: document.getElementById("categoria").value, imp: i, nota: document.getElementById("nota").value};

        if(editIdx === -1) spese.push(obj);
        else {
            spese[editIdx] = obj;
            document.getElementById("edit-index").value = "-1";
            document.getElementById("btn-salva").innerText = "SALVA MOVIMENTO";
            document.getElementById("form-label").innerText = "✍️ Nuova Operazione";
        }

        localStorage.setItem("moneyTrack_db", JSON.stringify(spese));
        document.getElementById("importo").value = ""; document.getElementById("nota").value = "";
        aggiornaApp();
    }

    function preparaModifica(idx) {
        const s = spese[idx];
        document.getElementById("tipo").value = s.tipo;
        aggiornaCategorie();
        document.getElementById("data").value = s.data;
        document.getElementById("categoria").value = s.cat;
        document.getElementById("importo").value = s.imp;
        document.getElementById("nota").value = s.nota;
        document.getElementById("edit-index").value = idx;
        document.getElementById("btn-salva").innerText = "AGGIORNA";
        document.getElementById("form-label").innerText = "✏️ Modifica";
        window.scrollTo(0,0);
    }

    function eliminaRiga(idx) { if(confirm("Eliminare?")) { spese.splice(idx,1); localStorage.setItem("moneyTrack_db", JSON.stringify(spese)); aggiornaApp(); } }

    function aggiungiSpesaFutura() {
        const d = document.getElementById("data-futura").value, desc = document.getElementById("desc-futura").value, i = parseFloat(document.getElementById("imp-futura").value);
        if(!d || !desc || isNaN(i)) return alert("Compila tutti i campi!");
        future.push({data: d, desc: desc, imp: i});
        localStorage.setItem("moneyTrack_future", JSON.stringify(future));
        aggiornaListaFuture();
        aggiornaApp();
    }

    function aggiornaListaFuture() {
        const c = document.getElementById("lista-future"); c.innerHTML = "";
        future.sort((a,b) => new Date(a.data) - new Date(b.data)).forEach((s, idx) => {
            c.innerHTML += `<tr><td><small>${s.data}</small><br><b>${s.desc}</b></td><td style="text-align:right">${s.imp.toFixed(2)}€ <span onclick="confermaFutura(${idx})" style="cursor:pointer; margin-left:10px;">✅</span></td></tr>`;
        });
    }

    function confermaFutura(idx) {
        const s = future[idx];
        spese.push({tipo: "Uscita", data: new Date().toISOString().split('T')[0], cat: "⏳ Programmata", imp: s.imp, nota: s.desc});
        future.splice(idx, 1);
        localStorage.setItem("moneyTrack_db", JSON.stringify(spese));
        localStorage.setItem("moneyTrack_future", JSON.stringify(future));
        aggiornaApp();
    }

    // --- GRAFICI ---
    function disegnaTorta(dati, totale) {
        const ctx = document.getElementById('graficoTorta').getContext('2d');
        if(graficoTorta) graficoTorta.destroy();
       
        const colori = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#32CD32', '#EA80FC'];

        graficoTorta = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(dati),
                datasets: [{ data: Object.values(dati), backgroundColor: colori, borderWidth: 2 }]
            },
            options: {
                maintainAspectRatio: false, cutout: '70%',
                plugins: { legend: { display: false } }
            },
            plugins: [{
                afterDraw(chart) {
                    const { ctx, width, height } = chart; ctx.save(); ctx.textAlign = 'center';
                    ctx.font = '12px Segoe UI'; ctx.fillStyle = '#888'; ctx.fillText('Uscite Mese', width/2, height/2 - 10);
                    ctx.font = 'bold 16px Segoe UI'; ctx.fillStyle = '#444'; ctx.fillText((privacy ? "***" : totale.toFixed(0))+"€", width/2, height/2 + 15);
                    ctx.restore();
                }
            }]
        });
    }

    function generaReport() {
        const ctx = document.getElementById('graficoAnnuale').getContext('2d');
        let entrate = new Array(12).fill(0), uscite = new Array(12).fill(0);
        const anno = new Date().getFullYear();

        spese.forEach(s => {
            const d = new Date(s.data);
            if(d.getFullYear() === anno) {
                if(s.tipo === "Entrata") entrate[d.getMonth()] += s.imp;
                else uscite[d.getMonth()] += s.imp;
            }
        });

        if(graficoBarre) graficoBarre.destroy();
        graficoBarre = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: mesiNomi,
                datasets: [
                    { label: 'Entrate', data: entrate, backgroundColor: '#28a745' },
                    { label: 'Uscite', data: uscite, backgroundColor: '#dc3545' }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Matrice
       aggiornaMatrice(annoCorrente);
}

function aggiornaMatrice(anno) {
    const head = document.getElementById("headerMesi");
    const body = document.getElementById("bodyMatrice");
    if(!head || !body) return;

    head.innerHTML = "<th class='sticky-col'>Categoria</th>" + ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"].map(m => `<th>${m}</th>`).join("");
   
    body.innerHTML = "";
    const categorieUniche = [...new Set(spese.map(s => s.cat))];
   
    if(categorieUniche.length === 0) {
        body.innerHTML = "<tr><td colspan='13' style='text-align:center'>Nessun dato per l'anno selezionato</td></tr>";
        return;
    }

    categorieUniche.forEach(cat => {
        let r = `<tr><td class='sticky-col'>${cat}</td>`;
        for(let i=0; i<12; i++) {
            let v = spese.filter(s =>
                s.cat === cat &&
                new Date(s.data).getMonth() === i &&
                new Date(s.data).getFullYear() === anno
            ).reduce((a,b) => a + (b.tipo === 'Entrata' ? b.imp : -b.imp), 0);
            r += `<td>${v !== 0 ? v.toFixed(0) + '€' : '-'}</td>`;
        }
        body.innerHTML += r + "</tr>";
    });
}

    // --- UTILS ---
    function togglePrivacy() { privacy = !privacy; aggiornaApp(); }
    function fintoLogin() { let u = prompt("Tuo nome?"); if(u) document.getElementById("loginBtn").innerText = u; }
    function esportaDati() {
        const data = JSON.stringify({spese, future, customCats});
        const blob = new Blob([data], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Backup_MoneyTrack_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }
    function importaDati(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const d = JSON.parse(ev.target.result);
            spese = d.spese; future = d.future || []; customCats = d.customCats || customCats;
            localStorage.setItem("moneyTrack_db", JSON.stringify(spese));
            localStorage.setItem("moneyTrack_future", JSON.stringify(future));
            localStorage.setItem("moneyTrack_cats", JSON.stringify(customCats));
            location.reload();
        };
        reader.readAsText(e.target.files[0]);
    }

    // Inizializzazione
    document.getElementById('data').value = new Date().toISOString().split('T')[0];
    aggiornaCategorie(); aggiornaApp();
    
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
